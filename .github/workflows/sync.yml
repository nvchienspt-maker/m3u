name: Sync & Validate nvc Playlist

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync.yml'
      - 'scripts/**'
  schedule:
    - cron: '15 */4 * * *'  # Chạy kiểm tra và cập nhật tự động mỗi 4 tiếng
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nvc-playlist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests cryptography

      - name: Check scripts syntax
        run: |
          python -m py_compile scripts/nvc_crawler.py
          python -m py_compile scripts/update.py

      - name: Crawl & Validate Live Channels
        run: python scripts/nvc_crawler.py

      - name: Run nvc sync & encrypt playlist
        run: python scripts/update.py
        env:
          UPSTREAM_PLAYLIST_URL: ${{ secrets.UPSTREAM_PLAYLIST_URL }}
          NVC_PRIVATE_KEY_B64: ${{ secrets.NVC_PRIVATE_KEY_B64 || secrets.NVCENC3_PRIVATE_KEY_B64 || secrets.VXMENC3_PRIVATE_KEY_B64 }}

      - name: Validate nvc playlist
        run: python scripts/update.py --validate-only
        env:
          NVC_PRIVATE_KEY_B64: ${{ secrets.NVC_PRIVATE_KEY_B64 || secrets.NVCENC3_PRIVATE_KEY_B64 || secrets.VXMENC3_PRIVATE_KEY_B64 }}

      - name: Commit and push changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add nvctivi.m3u nvctivi_proxy.m3u nvctivi_channels.json REPORT_LIVE_CHANNELS.md nvc.enc

          if git diff --cached --quiet; then
            echo "Không có thay đổi về luồng kênh, bỏ qua commit."
          else
            git commit -m "chore: auto-sync and validate nvc live playlist [skip ci]"
            git push
          fi

      - name: Sync & Overwrite to NVC-IPTV (api/iptv/link0.m3u)
        env:
          NVC_PAT: ${{ secrets.NVC_PAT || secrets.GH_PAT || secrets.SYNC_PAT || secrets.PAT || secrets.TOKEN || secrets.GH_TOKEN || secrets.NVC_TOKEN }}
        run: |
          if [ -z "$NVC_PAT" ]; then
            echo "Chưa cấu hình Secret NVC_PAT. Bỏ qua ghi đè sang repository NVC-IPTV."
            echo "Để tự động ghi đè sang NVC-IPTV, hãy thêm GitHub Secret 'NVC_PAT' vào repository m3u."
          else
            echo "Bắt đầu đồng bộ sang repository nvchienspt-maker/NVC-IPTV..."
            git clone --depth 1 "https://x-access-token:${NVC_PAT}@github.com/nvchienspt-maker/NVC-IPTV.git" target_repo
            mkdir -p target_repo/api/iptv
            cp nvctivi.m3u target_repo/api/iptv/link0.m3u
            cd target_repo
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add api/iptv/link0.m3u
            if git diff --cached --quiet; then
              echo "link0.m3u trên NVC-IPTV đã là bản mới nhất, không có thay đổi."
            else
              git commit -m "chore: auto-sync live playlist from m3u to link0.m3u [skip ci]"
              git push
              echo "Đã ghi đè thành công nội dung kênh sống vào api/iptv/link0.m3u trên NVC-IPTV!"
            fi
          fi
